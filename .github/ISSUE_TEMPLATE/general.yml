name: General issue
description: Report a bug, ask a question, or suggest an improvement
title: '[Issue] '
labels: [triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
      placeholder: A clear and concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps or code to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, PHP/Node version, etc.
      placeholder: e.g. Windows 11 + Chrome 120
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add any relevant logs or screenshots.
